<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100일 초대장</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at center,
        #16392c 0%,
        #0f2e23 45%,
        #0a2119 100%
    );

    color:#c7ae73;

    font-family:'Cormorant Garamond', serif;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
}

.container{
    width:90%;
    max-width:800px;
}

.title{

    font-size:5.8rem;

    letter-spacing:1rem;

    font-weight:400;

    margin-bottom:80px;

    color:#c7ae73;

    text-shadow:
        0 0 2px rgba(255,255,255,0.12),
        0 0 8px rgba(255,255,255,0.04);
}

.date{

    font-size:1.2rem;

    margin-bottom:35px;

    letter-spacing:2px;
}

.message{

    font-size:1.8rem;

    line-height:1.9;

    margin-bottom:60px;

    font-weight:300;
}

.question{

    font-size:1.7rem;

    margin-bottom:50px;
}

.buttons{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:160px;
}

button{

    background:transparent;

    color:#c7ae73;

    border:1px solid #c7ae73;

    padding:14px 45px;

    font-size:1.2rem;

    letter-spacing:2px;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:rgba(255,255,255,0.03);
}

</style>
</head>

<body>

<div class="container">

    <div class="title">초 대 장</div>

    <div class="date">
        2026년 06월 13일
    </div>

    <div class="message">
        김은희님이 김하준님을<br>
        100일 기념 데이트에 초대합니다.
    </div>

    <div class="question">
        초대에 응하시겠습니까?
    </div>

    <div class="buttons">

        <button onclick="acceptInvite()">
            YES
        </button>

        <button id="no">
            NO
        </button>

    </div>

</div>

<script>

const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseenter", () => {

    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

function acceptInvite(){

    document.body.innerHTML = `

    <div style="
    text-align:center;
    color:#c7ae73;
    font-family:'Cormorant Garamond', serif;
    ">

        <h1 style="
        font-size:4rem;
        font-weight:400;
        margin-bottom:20px;
        ">
        초대가 수락되었습니다
        </h1>

        <p style="
        font-size:1.8rem;
        ">
        2026년 06월 13일에 만나요 ♡
        </p>

    </div>

    `;
}

</script>

</body>
</html>
