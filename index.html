<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100일 초대장</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Cormorant Garamond', serif;

    color:#d4af37;

    background:
    radial-gradient(circle at center,
    rgba(212,175,55,0.12) 0%,
    rgba(212,175,55,0.04) 25%,
    #0d2f24 60%,
    #082118 100%);

    overflow:hidden;

    text-shadow:
    0 0 8px rgba(212,175,55,0.15),
    0 0 15px rgba(212,175,55,0.08);

}

.container{

    width:90%;
    max-width:800px;

    text-align:center;

}

.title{

    font-size:4.5rem;

    letter-spacing:12px;

    margin-bottom:60px;

    text-shadow:
    0 0 10px rgba(212,175,55,0.25),
    0 0 25px rgba(212,175,55,0.15);

}

.date{

    font-size:1.6rem;

    opacity:.9;

    margin-bottom:35px;

}

.message{

    font-size:2rem;

    line-height:1.8;

    font-weight:300;

    margin-bottom:50px;

}

.question{

    font-size:2rem;

    margin-bottom:50px;

}

.buttons{

    display:flex;

    justify-content:center;

    gap:180px;

    margin-top:50px;

}

button{

    background:transparent;

    color:#d4af37;

    border:1.5px solid #d4af37;

    padding:18px 55px;

    font-size:1.3rem;

    letter-spacing:2px;

    cursor:pointer;

    transition:all .3s ease;

}

button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 15px rgba(212,175,55,0.25),
    0 0 30px rgba(212,175,55,0.15);

}

</style>
</head>

<body>

<div class="container">

    <div class="title">[ 초대장 ]</div>

    <div class="date">
        2026년 06월 13일
    </div>

    <div class="message">
        김은희님이 김하준님을<br>
        100일 기념 데이트에 초대합니다.
    </div>

    <div class="question">
        초대에 응하시겠습니까?
    </div>

    <div class="buttons">

        <button id="yes" onclick="acceptInvite()">
            Yes
        </button>

        <button id="no">
            No
        </button>

    </div>

</div>

<script>

const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", () => {

    const maxX = window.innerWidth - 180;
    const maxY = window.innerHeight - 100;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

});

function acceptInvite(){

document.body.innerHTML = `

<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:'Cormorant Garamond', serif;
background:
radial-gradient(circle at center,
rgba(212,175,55,0.12) 0%,
rgba(212,175,55,0.04) 25%,
#0d2f24 60%,
#082118 100%);
color:#d4af37;
">

<div>

<h1 style="
font-size:4rem;
letter-spacing:5px;
margin-bottom:20px;
">
초대가 수락되었습니다 ✨
</h1>

<p style="
font-size:2rem;
">
2026년 06월 13일에 만나요 ❤️
</p>

</div>

</div>

`;

}

</script>

</body>
</html>
